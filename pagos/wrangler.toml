# Configuración del servidor de pagos (Cloudflare Worker). Los pasos están en README.md.
name = "audioguias-pagos"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Direcciones desde las que se permite usar el servidor. Para probar pagos desde una dirección de prueba (https://<rama>.audioguias.pages.dev), agrégala aquí por separado.
ALLOWED_ORIGINS = "https://xolotli.com,https://www.xolotli.com"
# Respaldo: solo se usa si no se puede leer la tabla de precios (PRECIOS_URL)
SITE_IDS = "mna,teotihuacan,chapultepec,centro_historico,chichen_itza,templo_mayor_catedral"
# Tabla de precios y acceso por sitio (la genera la sincronización desde la hoja CONTROL). Si no se puede leer, se usa el precio general de Stripe.
PRECIOS_URL = "https://xolotli.com/data/precios.json"
PASS_HOURS = "72"
MAX_DEVICES = "2"
# MODO DE PRUEBAS: "1" = todos entran gratis (no se pide pase). Para volver a cobrar, cambia a "0" y vuelve a publicar el servidor.
ACCESO_LIBRE = "1"
# Identificadores de precio de Stripe (empiezan con price_). Se crean en el panel de Stripe.
STRIPE_PRICE_ID_MXN = "price_1UNkSRPWcFq3JIhnDC2ZhLZJ"
STRIPE_PRICE_ID_USD = ""

# Aquí se guardan los pases comprados
[[kv_namespaces]]
binding = "PASES"
id = "2a15cc7724a04b42b185a68b7bf799a5"

# Aquí viven los MP3 de las piezas de pago
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "audioguias-audio"

# Aviso por correo del formulario de contacto (Cloudflare Email Routing). Necesita que el correo esté activado en el dominio y que
# la dirección de destino (secreto CONTACT_TO) esté verificada. Si algo falla, el mensaje igual queda guardado y se lee en el panel.
[[send_email]]
name = "CONTACTO_MAIL"

# Los secretos NO se escriben aquí. Se guardan con:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put TOKEN_SECRET
#   npx wrangler secret put CONTACT_TO     (opcional: correo al que llegan los avisos del formulario)
#   npx wrangler secret put CODES_KEY      (opcional: clave con la que GitHub publica los códigos de acceso de la hoja CODIGOS)

# ---------------------------------------------------------------------------------------------------------------------
# ENTORNO DE PRUEBAS DE COBRO ("pruebas"): un servidor APARTE que sí pide pase y cobra con Stripe en modo de PRUEBA.
# Sirve para probar el cobro completo sin tocar el servidor real (que sigue en modo gratis para quienes están probando la app).
# Se publica con el botón «Publicar el servidor de cobro de PRUEBAS» y solo lo usa la rama de prueba feature/pagos-prueba.
# Usa sus propios secretos (STRIPE_SECRET_KEY_PRUEBAS, TOKEN_SECRET_PRUEBAS) y su propio KV, para no mezclar pases con los reales.
# Guía completa: docs/PRUEBAS_DE_COBRO.md
# (En Wrangler los valores de cada entorno NO se heredan: por eso se repiten aquí.)
# ---------------------------------------------------------------------------------------------------------------------
[env.pruebas]
name = "audioguias-pagos-pruebas"

[env.pruebas.vars]
# Solo la dirección de prueba de la rama feature/pagos-prueba (Cloudflare cambia la diagonal de la rama por un guion).
ALLOWED_ORIGINS = "https://feature-pagos-prueba.audioguias.pages.dev"
SITE_IDS = "mna,teotihuacan,chapultepec,centro_historico,chichen_itza,templo_mayor_catedral"
PRECIOS_URL = "https://xolotli.com/data/precios.json"
PASS_HOURS = "72"
MAX_DEVICES = "2"
# Aquí SÍ se pide pase: es la razón de existir de este entorno.
ACCESO_LIBRE = "0"
# El price_ de Stripe en modo de prueba (el mismo que usa hoy el servidor real mientras Stripe esté en pruebas).
STRIPE_PRICE_ID_MXN = "price_1UNkSRPWcFq3JIhnDC2ZhLZJ"
STRIPE_PRICE_ID_USD = ""

[[env.pruebas.kv_namespaces]]
binding = "PASES"
# El botón de publicar crea este KV (se llama "audioguias-pases-pruebas") y pone aquí su id al publicar.
id = "PENDIENTE_KV_PRUEBAS"

# Solo lee los MP3 ya existentes; no escribe nada nuevo
[[env.pruebas.r2_buckets]]
binding = "AUDIO"
bucket_name = "audioguias-audio"

[[env.pruebas.send_email]]
name = "CONTACTO_MAIL"

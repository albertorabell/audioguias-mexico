# Configuración del servidor de pagos (Cloudflare Worker). Los pasos están en README.md.
name = "audioguias-pagos"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Direcciones desde las que se permite usar el servidor (la de tu sitio en GitHub Pages)
ALLOWED_ORIGINS = "https://albertorabell.github.io,https://xolotli.com"
# Respaldo: solo se usa si no se puede leer la tabla de precios (PRECIOS_URL)
SITE_IDS = "mna,teotihuacan,chapultepec,centro_historico,chichen_itza,templo_mayor_catedral"
# Tabla de precios y acceso por sitio (la genera la sincronización desde la hoja CONTROL). Si no se puede leer, se usa el precio general de Stripe.
PRECIOS_URL = "https://xolotli.com/data/precios.json"
PASS_HOURS = "72"
MAX_DEVICES = "2"
# MODO DE PRUEBAS: "1" = todos entran gratis (no se pide pase). Para volver a cobrar, cambia a "0" y vuelve a publicar el servidor.
ACCESO_LIBRE = "1"
# Identificadores de precio de Stripe (empiezan con price_). Se crean en el panel de Stripe.
STRIPE_PRICE_ID_MXN = "price_1UNkSRPWcFq3JIhnDC2ZhLZJ"
STRIPE_PRICE_ID_USD = ""

# Aquí se guardan los pases comprados
[[kv_namespaces]]
binding = "PASES"
id = "2a15cc7724a04b42b185a68b7bf799a5"

# Aquí viven los MP3 de las piezas de pago
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "audioguias-audio"

# Los secretos NO se escriben aquí. Se guardan con:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put TOKEN_SECRET
#   npx wrangler secret put CODES_KEY      (opcional: clave con la que GitHub publica los códigos de acceso de la hoja CODIGOS)

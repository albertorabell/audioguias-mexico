<svg id="xolo-chalcatzingo-museo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img">
<defs>
  <style>
    .bg { fill: #FAF7F2; }
    .site-ground { fill: #F3EFE8; stroke: #DFD8CC; stroke-width: 1.5; }
    .garden { fill: #E3ECD8; stroke: #BACBA6; stroke-width: 1.5; }
    .water { fill: #D7E7EE; stroke: #9EC0D0; stroke-width: 1.5; }
    .floor { fill: #FFFFFF; stroke: none; }
    .room-fill { fill: #F6F2EB; stroke: none; }
    .room-hi { fill: #FCEEF3; stroke: none; }
    .patio { fill: #FAF7F2; stroke: #D8CFC2; stroke-width: 1.5; }
    .tower { fill: #DDD5C9; stroke: #3A322C; stroke-width: 5.2; stroke-linecap: square; stroke-linejoin: miter; }
    .wall-ext { fill: none; stroke: #3A322C; stroke-width: 5.5; stroke-linecap: square; stroke-linejoin: miter; }
    .wall-int { fill: none; stroke: #6B6158; stroke-width: 2.3; stroke-linecap: square; stroke-linejoin: miter; }
    .wall-glass { fill: none; stroke: #5E9AB5; stroke-width: 3.4; stroke-dasharray: 7,3; }
    .door-gap { fill: none; stroke: #F6F2EB; stroke-width: 6.5; stroke-linecap: butt; }
    .door-gap-w { fill: none; stroke: #FFFFFF; stroke-width: 6.5; stroke-linecap: butt; }
    .pier { fill: #3A322C; stroke: none; }
    .stair { fill: none; stroke: #8B8075; stroke-width: 1.3; }
    .canopy { fill: #3A322C; fill-opacity: 0.06; stroke: #8B8075; stroke-width: 1.4; stroke-dasharray: 6,4; }
    .dome { fill: none; stroke: #A99E92; stroke-width: 1.4; stroke-dasharray: 4,3; }
    .mural-accent { fill: none; stroke: #E5195F; stroke-width: 4.5; stroke-linecap: round; }
    .accent-ring { fill: none; stroke: #E5195F; stroke-width: 1.4; stroke-dasharray: 3,2; }
    .compass-ring { fill: #FFFFFF; stroke: #DCD5C9; stroke-width: 1.5; }
    .scale-line { stroke: #6B6158; stroke-width: 2; }
    .lbl { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #3A322C; text-anchor: middle; dominant-baseline: middle; }
    .lbl-sm { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 9.8px; font-weight: 600; fill: #6B6158; text-anchor: middle; dominant-baseline: middle; }
    .street { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px; fill: #8E8378; text-anchor: middle; }
    .compass { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #E5195F; text-anchor: middle; }
    .pin-circle { fill: #E5195F; stroke: #FFFFFF; stroke-width: 2.2; }
    .pin-num { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    
  </style>
</defs>
  <rect class="bg" x="0" y="0" width="1000" height="700"/>
  <rect class="garden" x="45" y="45" width="910" height="600"/>
  <rect data-room-id="acceso_portico" class="patio" x="140" y="480" width="720" height="100"/>
  <rect data-room-id="sala_mon9" class="room-hi" x="140" y="120" width="450" height="360"/>

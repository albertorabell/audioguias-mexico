<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Prehispanic Solar Disk Elements -->
  <g transform="translate(256, 256)">
    <!-- Outer Ray Ring -->
    <circle r="150" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 8" opacity="0.6"/>
    <circle r="126" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    
    <!-- Sun Glyph core -->
    <circle r="88" fill="#1e1b18" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle r="52" fill="url(#goldGrad)" opacity="0.25"/>

    <!-- Stepped Pyramid glyph / icon -->
    <path d="M-40 32 L-30 32 L-30 16 L-20 16 L-20 0 L-10 0 L-10 -16 L10 -16 L10 0 L20 0 L20 16 L30 16 L30 32 L40 32 L40 40 L-40 40 Z" fill="url(#goldGrad)"/>
    <polygon points="0,-42 -14,-18 14,-18" fill="url(#goldGrad)"/>

    <!-- Headphones wrapping the heritage disk -->
    <path d="M -130 10 A 130 130 0 0 1 130 10" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Left Ear Cup -->
    <rect x="-146" y="-10" width="32" height="74" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>
    <!-- Right Ear Cup -->
    <rect x="114" y="-10" width="32" height="74" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="4"/>

    <!-- Sound waves -->
    <path d="M -168 12 A 18 18 0 0 0 -168 42" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 168 12 A 18 18 0 0 1 168 42" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -184 0 A 32 32 0 0 0 -184 54" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 184 0 A 32 32 0 0 1 184 54" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>

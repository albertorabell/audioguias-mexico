let withPins = true;

function getSvg(item) { return withPins ? item.svg_pins : item.svg_clean; }
function getSuffix() { return withPins ? "_con_pines" : ""; }

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function downloadSvg(item) {
  const blob = new Blob([getSvg(item)], { type: "image/svg+xml;charset=utf-8" });
  downloadBlob(blob, item.plan_id + getSuffix() + ".svg");
}

function downloadPng(item) {
  return new Promise(resolve => {
    const svgStr = getSvg(item);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 2000;
      canvas.height = 1400;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FAF7F2";
      ctx.fillRect(0, 0, 2000, 1400);
      ctx.drawImage(img, 0, 0, 2000, 1400);
      canvas.toBlob(blob => {
        if (blob) downloadBlob(blob, item.plan_id + getSuffix() + ".png");
        resolve();
      }, "image/png");
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
  });
}

function render() {
  document.getElementById("grid1").innerHTML = "";
  document.getElementById("grid2").innerHTML = "";
  ITEMS.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="card-head"><span class="card-title">' + item.title + '</span><small>' + item.pin_count + ' pines</small></div>' +
      '<div class="preview">' + getSvg(item) + '</div>' +
      '<div class="actions"><button class="btn-svg">Descargar SVG</button><button class="btn-png primary">Descargar PNG (2000×1400)</button></div>';
    card.querySelector(".btn-svg").onclick = () => downloadSvg(item);
    card.querySelector(".btn-png").onclick = () => downloadPng(item);
    document.getElementById(item.bloque === 1 ? "grid1" : "grid2").appendChild(card);
  });
}

document.getElementById("togglePins").onclick = e => {
  withPins = !withPins;
  e.target.textContent = withPins ? "Viendo: Con pines (cambiar a limpios)" : "Viendo: Limpios para app (cambiar a con pines)";
  render();
};

document.getElementById("dlAllPng").onclick = async () => {
  for (const item of ITEMS) {
    await downloadPng(item);
    await new Promise(r => setTimeout(r, 350));
  }
};

render();

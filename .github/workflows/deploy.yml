name: Compilar y desplegar Vite en GitHub Pages

on:
  push:
    branches: ['main']
  # Botón manual: pestaña Actions > "Run workflow"
  workflow_dispatch:
  # Automático: reconstruye la app cada 6 horas para leer los cambios del Google Sheets (no usa token)
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar paquetes
        run: npm install

      - name: Compilar proyecto con Vite
        run: npm run build

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

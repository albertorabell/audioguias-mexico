name: Compilar y desplegar Vite en GitHub Pages

on:
  push:
    branches: ['main']
  # Botón manual: pestaña Actions > "Run workflow"
  workflow_dispatch:
  # Automático: reconstruye la app cada 6 horas para leer los cambios del Google Sheets (no usa token)
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar paquetes
        run: npm install

      - name: Compilar proyecto con Vite
        run: npm run build
        env:
          # Dirección del servidor de cobro. Si la variable no existe, el cobro queda apagado ("Disponible pronto").
          # Se crea en: Settings > Secrets and variables > Actions > Variables > PAGOS_API_URL
          VITE_PAYMENTS_API_URL: ${{ vars.PAGOS_API_URL }}

      # Los textos de pago (guiones, retos, mito y ficha técnica) NO van en el sitio: se guardan en Cloudflare R2 y el servidor
      # de cobro solo los entrega con un pase vigente. Si esto falla, no se publica el sitio (así nunca queda una app sin textos).
      - name: Subir los textos de pago a Cloudflare R2
        run: node scripts/subir-textos.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Generar audios MP3 (botón manual)

# Se corre a mano: pestaña Actions > "Generar audios MP3" > Run workflow.
# Sin marcar la casilla "generar" solo MUESTRA el plan y el costo aproximado (no gasta nada).
on:
  workflow_dispatch:
    inputs:
      proveedor:
        description: 'Voz: azure, openai o prueba (prueba = MP3 en silencio, gratis, para ensayar)'
        type: choice
        options: [azure, openai, prueba]
        default: azure
      idiomas:
        description: 'Idiomas separados por coma (es, o es,en)'
        type: string
        default: 'es'
      piezas:
        description: 'Qué piezas: gratis, premium o todas'
        type: choice
        options: [gratis, premium, todas]
        default: gratis
      limite:
        description: 'Máximo de audios en esta corrida (déjalo en 3 para probar; vacío = sin límite)'
        type: string
        default: '3'
      generar:
        description: 'Marca la casilla para generar de verdad (gasta dinero con azure/openai)'
        type: boolean
        default: false
      forzar:
        description: 'Regenerar aunque el texto no haya cambiado'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: generar-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar que estén las claves necesarias (antes de gastar nada)
        env:
          GENERAR: ${{ inputs.generar }}
          PROVEEDOR: ${{ inputs.proveedor }}
          PIEZAS: ${{ inputs.piezas }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GENERAR" != "true" ]; then exit 0; fi
          if [ "$PROVEEDOR" = "azure" ] && { [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; }; then
            echo "::error::Faltan los secretos AZURE_SPEECH_KEY y AZURE_SPEECH_REGION (Settings > Secrets and variables > Actions)."; exit 1
          fi
          if [ "$PROVEEDOR" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi
          if [ "$PIEZAS" != "gratis" ] && { [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; }; then
            echo "::error::Los audios de pago se guardan en Cloudflare R2: faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. No se generó nada."; exit 1
          fi

      - name: Traer los textos más recientes del Google Sheets
        run: node scripts/sync-sheets.js

      - name: Plan (o generación)
        env:
          IDIOMAS: ${{ inputs.idiomas }}
          PIEZAS: ${{ inputs.piezas }}
          PROVEEDOR: ${{ inputs.proveedor }}
          LIMITE: ${{ inputs.limite }}
          GENERAR: ${{ inputs.generar }}
          FORZAR: ${{ inputs.forzar }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/correr-generar-audio.sh

      - name: Subir los audios de pago a Cloudflare R2
        if: ${{ inputs.generar }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/subir-audio-premium.mjs

      - name: Guardar los audios gratis y la lista (manifiesto) en el repositorio
        if: ${{ inputs.generar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "No hay nada nuevo que guardar."
          else
            git commit -m "Audios MP3 generados (${{ inputs.proveedor }}, ${{ inputs.idiomas }}, ${{ inputs.piezas }})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publicar el sitio con los audios nuevos (solo si se corrió en main)
        if: ${{ inputs.generar && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

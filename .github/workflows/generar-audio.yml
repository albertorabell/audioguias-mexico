name: Generar audios MP3 (botón manual)

# Se corre a mano: pestaña Actions > "Generar audios MP3" > Run workflow.
# Sin marcar la casilla "generar" solo MUESTRA el plan y el costo aproximado (no gasta nada).
on:
  workflow_dispatch:
    inputs:
      proveedor:
        description: 'Voz: azure, openai o prueba (prueba = MP3 en silencio, gratis, para ensayar)'
        type: choice
        options: [azure, openai, prueba]
        default: azure
      idiomas:
        description: 'Idiomas separados por coma (es, o es,en)'
        type: string
        default: 'es'
      piezas:
        description: 'Qué piezas: gratis, premium o todas'
        type: choice
        options: [gratis, premium, todas]
        default: gratis
      limite:
        description: 'Máximo de audios en esta corrida (déjalo en 3 para probar; vacío = sin límite)'
        type: string
        default: '3'
      generar:
        description: 'Marca la casilla para generar de verdad (gasta dinero con azure/openai)'
        type: boolean
        default: false
      forzar:
        description: 'Regenerar aunque el texto no haya cambiado'
        type: boolean
        default: false
      reubicar:
        description: 'Solo mover en R2 los audios de piezas que cambiaron de gratis a pago (o al revés). No genera ni gasta voz'
        type: boolean
        default: false
      borrar_todo:
        description: 'PELIGRO: borra de R2 TODOS los MP3 y vacía la lista (manifiesto). Úsalo cuando los textos cambiaron y las voces viejas ya no corresponden. No gasta voz; para volver a tener voz hay que regenerar'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: generar-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar que estén las claves necesarias (antes de gastar nada)
        env:
          GENERAR: ${{ inputs.generar }}
          REUBICAR: ${{ inputs.reubicar }}
          BORRAR: ${{ inputs.borrar_todo }}
          PROVEEDOR: ${{ inputs.proveedor }}
          PIEZAS: ${{ inputs.piezas }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GENERAR" != "true" ] && [ "$REUBICAR" != "true" ] && [ "$BORRAR" != "true" ]; then exit 0; fi
          # Todo el audio vive en Cloudflare R2 (carpetas libre/ y pago/): sin esas claves no se puede guardar nada
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Los audios se guardan en Cloudflare R2: faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions). No se generó nada."; exit 1
          fi
          if [ "$GENERAR" != "true" ]; then exit 0; fi
          if [ "$PROVEEDOR" = "azure" ] && { [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; }; then
            echo "::error::Faltan los secretos AZURE_SPEECH_KEY y AZURE_SPEECH_REGION (Settings > Secrets and variables > Actions)."; exit 1
          fi
          if [ "$PROVEEDOR" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY (Settings > Secrets and variables > Actions)."; exit 1
          fi

      - name: Traer los textos más recientes del Google Sheets
        run: node scripts/sync-sheets.js

      - name: Plan (o generación)
        if: ${{ !inputs.borrar_todo }}
        env:
          IDIOMAS: ${{ inputs.idiomas }}
          PIEZAS: ${{ inputs.piezas }}
          PROVEEDOR: ${{ inputs.proveedor }}
          LIMITE: ${{ inputs.limite }}
          GENERAR: ${{ inputs.generar }}
          FORZAR: ${{ inputs.forzar }}
          REUBICAR: ${{ inputs.reubicar }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/correr-generar-audio.sh

      # Botón "borrar_todo": quita de R2 todos los MP3 de la lista y deja la lista vacía (la app vuelve a la voz del teléfono)
      - name: Borrar todos los audios de R2 y vaciar la lista
        if: ${{ inputs.borrar_todo }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/borrar-audios.mjs

      # Se sube aunque la generación se haya cortado a medias: lo que sí se generó ya se pagó y no debe perderse
      - name: Subir los audios a Cloudflare R2 (libre/ y pago/)
        if: ${{ !cancelled() && inputs.generar }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/subir-audio.mjs

      - name: Guardar la lista de audios (manifiesto) en el repositorio
        if: ${{ !cancelled() && (inputs.generar || inputs.reubicar || inputs.borrar_todo) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/manifest.json
          if git diff --cached --quiet; then
            echo "No hay nada nuevo que guardar."
          else
            git commit -m "Lista de audios MP3 actualizada (${{ inputs.proveedor }}, ${{ inputs.idiomas }}, ${{ inputs.piezas }})"
            # Antes de traer lo nuevo hay que soltar los archivos que cambió la sincronización (public/data); git no deja hacer rebase con cambios sueltos
            git reset --hard HEAD
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publicar el sitio con los audios nuevos (solo si se corrió en main)
        if: ${{ !cancelled() && (inputs.generar || inputs.reubicar || inputs.borrar_todo) && github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

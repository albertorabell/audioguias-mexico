name: Publicar la app en Cloudflare Pages

# Compila la app (leyendo los Google Sheets) y la sube a Cloudflare Pages (proyecto "audioguias").
#  - Cambios en main, o el botón «Run workflow» sobre main  →  se publica xolotli.com.
#  - Cambios en una rama feature/**, o el botón sobre esa rama  →  una dirección de PRUEBA (https://<rama>.audioguias.pages.dev) que no toca xolotli.com
#    y lleva la marca «noindex» para que Google no la guarde.
# Ya no se reconstruye solo cada 6 horas: cuando cambies un Sheet (textos, precios, códigos), aprieta el botón sobre main.
# Con "conectar_dominio" = si, también conecta xolotli.com.
on:
  push:
    branches: ['main', 'feature/**']
  workflow_dispatch:
    inputs:
      conectar_dominio:
        description: 'Conectar también el dominio xolotli.com (si/no)'
        default: 'no'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Instalar paquetes
        run: npm install
      - name: Compilar proyecto con Vite
        run: npm run build
        env:
          VITE_PAYMENTS_API_URL: ${{ vars.PAGOS_API_URL }}
          SYNC_PREVIEW: '1'
      - name: Crear el proyecto en Cloudflare Pages (si no existe)
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create audioguias --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DNS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Marcar las pruebas como «no indexar» (Google no debe guardar las direcciones de prueba)
        if: ${{ github.ref_name != 'main' }}
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers
      - name: Subir la app a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DNS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAMA: ${{ github.ref_name }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist --project-name=audioguias --branch="$RAMA" --commit-dirty=true | tee subida.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' subida.log | tail -1 || true)
          if [ "$RAMA" = "main" ]; then
            echo "Publicado en xolotli.com (producción)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dirección de prueba de la rama $RAMA: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Dirección de prueba::$url"
          fi
      - name: Conectar el dominio xolotli.com
        if: ${{ inputs.conectar_dominio == 'si' || inputs.conectar_dominio == 'sí' }}
        run: python3 scripts/cloudflare-dominio.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DNS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Descargar audios (copia local)

# Botón manual. Baja de Cloudflare R2 todos los MP3 de UN idioma y los deja como archivo descargable (un zip de ~250-400 MB).
# El archivo dura 1 día y solo lo ven las personas con acceso al repositorio. Se corre una vez por idioma; descarga el zip y deja que caduque.
# IMPORTANTE: corre esto cuando el repositorio ya sea privado (los audios de pago no deben quedar a la vista).
on:
  workflow_dispatch:
    inputs:
      idioma:
        description: 'Idioma a bajar'
        type: choice
        options: [es, en, fr, pl]
        default: es

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  descargar:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar los MP3 de R2
        env:
          IDIOMA: ${{ inputs.idioma }}
        run: node scripts/descargar-audios.mjs --lang "$IDIOMA"
      - name: Dejar el zip para descargar
        uses: actions/upload-artifact@v7
        with:
          name: audios-${{ inputs.idioma }}
          path: audios-descarga/${{ inputs.idioma }}
          compression-level: 0
          retention-days: 1

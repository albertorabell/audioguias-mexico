name: Publicar el servidor de cobro (Cloudflare)

# Se corre a mano: pestaña Actions > "Publicar el servidor de cobro" > Run workflow.
# Sube la carpeta pagos/ a Cloudflare y guarda ahí las claves secretas. Los pasos completos están en docs/IDIOMA_MP3_COBRO.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas del servidor de cobro
        run: node --test pagos/test/worker.test.mjs

      - name: Revisar que estén los datos necesarios
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: |
          faltan=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STRIPE_SECRET_KEY TOKEN_SECRET; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estos secretos en GitHub (Settings > Secrets and variables > Actions):$faltan"; exit 1
          fi
          if [ "${#TOKEN_SECRET}" -lt 32 ]; then
            echo "::error::TOKEN_SECRET es muy corto: usa al menos 32 caracteres al azar."; exit 1
          fi
          if grep -q "REEMPLAZA" pagos/wrangler.toml; then
            echo "::error::En pagos/wrangler.toml todavía hay valores que dicen REEMPLAZA_...: cámbialos por tus datos reales (el price_ de Stripe y el id del KV)."; exit 1
          fi

      - name: Publicar en Cloudflare y guardar las claves secretas
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pagos
          command: deploy
          secrets: |
            STRIPE_SECRET_KEY
            TOKEN_SECRET
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}

name: Capturas de la app (botón manual)

# Compila la app, saca capturas de pantalla (teléfono y escritorio) y las guarda en la rama "capturas" del repositorio
# y como archivo descargable al final de la corrida. No publica nada en el sitio.
on:
  workflow_dispatch:
  # También al subir cambios a una rama de diseño, para revisar cómo se ve sin tocar el sitio publicado
  push:
    branches: ['feature/diseno**', 'feature/sitios-desde-control']

concurrency:
  group: capturas
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar paquetes
        run: npm install --no-audit --no-fund
      - name: Compilar (con datos al día y el selector de idioma visible)
        env:
          VITE_PAYMENTS_API_URL: https://pagos.test
          VITE_PUBLISHED_LANGUAGES: es,en,fr,pl
          # Incluye los sitios en revisión (se ven con ?preview); estas capturas no se publican
          SYNC_PREVIEW: '1'
          # El robot de Google lee en privado los Sheets de la carpeta Audioguías México (ver scripts/google-sheets-lib.mjs).
          # Solo este paso lo necesita: no se le da a la instalación de paquetes ni al resto.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/ci-run.mjs datos -- node scripts/sync-sheets.js
          node scripts/ci-run.mjs compilar -- npx vite build --outDir dist-capturas
      - name: Instalar el navegador (Playwright)
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Sacar las capturas
        run: |
          npx vite preview --outDir dist-capturas --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/ci-run.mjs capturas -- node scripts/capturas.mjs capturas-salida http://localhost:4173
      - name: Guardar como archivo descargable
        uses: actions/upload-artifact@v7
        with:
          name: capturas-de-la-app
          path: capturas-salida
          retention-days: 7
      - name: Guardar en la rama "capturas"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir ../pub && cp -r capturas-salida/. ../pub/ && cd ../pub
          git init -q -b capturas
          git config user.name "capturas-bot"
          git config user.email "capturas-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas de la app"
          # El permiso viaja en una cabecera, no dentro de la dirección
          cabecera="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$cabecera" push -f "https://github.com/$REPO.git" capturas

name: Revisar permisos de Cloudflare

# Se corre a mano. Solo LEE: dice si la llave de Cloudflare sirve y qué puede hacer (no cambia nada).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Revisar la llave y la cuenta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_DNS: ${{ secrets.CLOUDFLARE_API_TOKEN_DNS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-revisar.py

name: Capturas de Teotihuacán (temporal)
on:
  push:
    branches: ['feature/teotihuacan-en-la-app']
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/sync-sheets.js
      - run: VITE_PUBLISHED_LANGUAGES=es,en,fr,pl npx vite build --outDir dist-cap
      - run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          npx vite preview --outDir dist-cap --port 4175 --strictPort &
          sleep 5
          node scripts/ci-run.mjs capturas -- node e2e/capturas.mjs
      - run: node scripts/ci-run.mjs cap-01 -- node -e "console.log(require('fs').readFileSync('capturas-teo/01-inicio.b64','utf8'))"
      - run: node scripts/ci-run.mjs cap-02 -- node -e "console.log(require('fs').readFileSync('capturas-teo/02-teotihuacan.b64','utf8'))"
      - run: node scripts/ci-run.mjs cap-03 -- node -e "console.log(require('fs').readFileSync('capturas-teo/03-mapa.b64','utf8'))"
      - run: node scripts/ci-run.mjs cap-04 -- node -e "console.log(require('fs').readFileSync('capturas-teo/04-rutas.b64','utf8'))"

name: Datos del mapa (coordenadas y pedazo de mapa de un sitio)

# Trae coordenadas candidatas desde OpenStreetMap y Wikipedia y, si se pide, recorta el mapa de la zona
# (Protomaps, datos de OpenStreetMap) para guardarlo en el repo. No publica nada en el sitio.
on:
  workflow_dispatch:
    inputs:
      sitio:
        description: 'Nombre corto del sitio (carpeta de salida), por ejemplo teotihuacan'
        default: 'teotihuacan'
      lat:
        description: 'Latitud del centro'
        default: '19.6925'
      lng:
        description: 'Longitud del centro'
        default: '-98.8438'
      radio:
        description: 'Radio en metros para buscar lugares'
        default: '3500'
      recortar_mapa:
        description: 'Recortar también el pedazo de mapa sin internet (sí/no)'
        default: 'no'
      bbox_mapa:
        description: 'Recuadro del mapa: oeste,sur,este,norte (solo si recortas)'
        default: '-98.885,19.655,-98.805,19.725'

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer lugares con coordenadas
        run: node scripts/mapa/obtener-coordenadas.mjs "candidatas-mapa/${{ inputs.sitio }}" "${{ inputs.lat }}" "${{ inputs.lng }}" "${{ inputs.radio }}"
      - name: Recortar el mapa de la zona
        if: ${{ inputs.recortar_mapa == 'sí' || inputs.recortar_mapa == 'si' }}
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          aviso() { echo "::warning::$1" | tr '\n' ' '; }
          curl -sSL -o pm.tgz https://github.com/protomaps/go-pmtiles/releases/download/v1.22.3/go-pmtiles_1.22.3_Linux_x86_64.tar.gz || { aviso "No se pudo bajar pmtiles"; exit 1; }
          tar xzf pm.tgz pmtiles || { aviso "No se pudo abrir pmtiles: $(file pm.tgz)"; exit 1; }
          aviso "pmtiles: $(./pmtiles --version 2>&1)"
          meta=$(curl -sS -m 60 https://build-metadata.protomaps.dev/builds.json 2>&1 | head -c 300)
          aviso "builds.json: $meta"
          build=$(echo "$meta" | head -c 0; curl -sS -m 60 https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(b['key'] for b in d)[-1])") || { aviso "No se pudo leer builds.json"; exit 1; }
          aviso "Mapa base: $build"
          salida="$GITHUB_WORKSPACE/candidatas-mapa/${{ inputs.sitio }}/${{ inputs.sitio }}.pmtiles"
          ./pmtiles extract "https://build.protomaps.com/$build" "$salida" --bbox="${{ inputs.bbox_mapa }}" --maxzoom=17 > extract.log 2>&1 || { aviso "extract falló: $(tail -c 600 extract.log)"; exit 1; }
          aviso "extract: $(tail -c 300 extract.log) $(ls -la "$salida")"

      - name: Guardar en la rama mapa-candidatas
        if: always()
        run: |
          git config user.name "mapa-bot"
          git config user.email "mapa-bot@users.noreply.github.com"
          git checkout -q --orphan mapa-candidatas
          git rm -rfq --cached . > /dev/null 2>&1 || true
          git add -f candidatas-mapa
          git commit -qm "Datos de mapa de ${{ inputs.sitio }}"
          git push -f origin mapa-candidatas
